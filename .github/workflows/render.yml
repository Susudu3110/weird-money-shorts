name: render
# Renders the whole video on GitHub's servers, IN PARALLEL:
# 4 jobs each render 15 s of the film (Kokoro voice -> Whisper timings -> 360 frames),
# then a merge job stitches the segments and adds the sound mix, and commits the MP4.
on:
  workflow_dispatch:
  push:
    paths: ["script.json", "src/**", "skill/**", "tools/**", "pipeline/**", ".github/workflows/render.yml"]

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  segment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { i: 0, start: 0,  end: 15 }
          - { i: 1, start: 15, end: 30 }
          - { i: 2, start: 30, end: 45 }
          - { i: 3, start: 45, end: 60 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (TTS + Whisper)
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q numpy scipy kokoro-onnx faster-whisper

      - name: Cache voice + whisper models (~850 MB, downloaded once)
        uses: actions/cache@v4
        with:
          path: ~/.faceless-shorts
          key: models-kokoro-whisper-v1

      - name: Voice (Kokoro TTS, local)
        run: bash skill/py skill/voice.py .

      - name: Word timings (Whisper small.en, local)
        run: bash skill/py skill/words.py .

      - name: Render segment ${{ matrix.i }} (headless Chrome, software GL)
        env:
          CHROME: /usr/bin/google-chrome-stable
          FPS: 24
          SOFTWARE_GL: "1"
        run: |
          rm -f data/mix.wav   # no audio in segments; the merge job adds the mix
          node tools/capture.mjs video renders/seg-${{ matrix.i }}.mp4 ${{ matrix.start }} ${{ matrix.end }}
          ffprobe -v error -show_entries format=duration -of default=nw=1 renders/seg-${{ matrix.i }}.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.i }}
          path: renders/seg-${{ matrix.i }}.mp4

  merge:
    needs: segment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache the voice model (~340 MB, downloaded once)
        uses: actions/cache@v4
        with:
          path: ~/.faceless-shorts
          key: models-kokoro-whisper-v1

      - name: Install Python deps + voice model (for the narration the mix needs)
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q numpy scipy kokoro-onnx faster-whisper
          python skill/voice.py . --download

      - name: Rebuild the sound mix (voice + music + cues)
        run: python skill/voice.py . && python tools/mix.py .

      - name: Download the 4 segments
        uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          path: renders/
          merge-multiple: true

      - name: Concatenate + add audio
        run: |
          ls -la renders/
          printf "file 'seg-0.mp4'\nfile 'seg-1.mp4'\nfile 'seg-2.mp4'\nfile 'seg-3.mp4'\n" > renders/list.txt
          ffmpeg -v error -y -f concat -safe 0 -i renders/list.txt -i data/mix.wav \
            -c:v copy -c:a aac -b:a 192k -shortest renders/maple-syrup-heist.mp4
          rm -f renders/seg-*.mp4 renders/list.txt
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 renders/maple-syrup-heist.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: maple-syrup-heist-mp4
          path: renders/maple-syrup-heist.mp4

      - name: Commit the MP4 back to the repo
        run: |
          git config user.name "render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add renders/maple-syrup-heist.mp4
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "render: maple-syrup-heist.mp4 (4-way parallel on GitHub Actions) [skip ci]"
            git push
          fi
